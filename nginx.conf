# nginx config for the Angular SPA (application builder output).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are served as-is; everything else falls back to index.html
    # so Angular router deep links work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
